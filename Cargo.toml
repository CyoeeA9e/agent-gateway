[package]
name = "agentbot"
version = "0.1.0"
edition = "2024"

[dependencies]
xmpp = { git = "https://gitlab.com/xmpp-rs/xmpp-rs.git", rev = "697d4d3bef36e57beba547c64f60a5a0d502febf", default-features = false, features = ["native-tls", "starttls", "serde", "escape-hatch"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
agent-client-protocol = { version = "0.11.1", features = ["unstable_session_usage", "unstable_session_resume"] }
agent-client-protocol-tokio = "0.11.1"
tokio-util = { version = "0.7", features = ["compat"] }
serde_json = "1"
